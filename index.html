<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG → SomMark</title>
<style>:root {
      --bg:             #0d0f14;
      --bg-surface:     #13161d;
      --bg-elevated:    #1a1d26;
      --border:         rgba(255, 255, 255, 0.07);
      --accent:         #6366f1;
      --accent-dim:     rgba(99, 102, 241, 0.15);
      --accent-border:  rgba(99, 102, 241, 0.45);
      --text-primary:   #e8eaf0;
      --text-secondary: #8b8fa8;
      --text-muted:     #4b4f68;
      --green:          #4ade80;
      --green-dim:      rgba(74, 222, 128, 0.12);
      --red:            #f87171;
      --font-sans:      "Inter", system-ui, sans-serif;
      --font-mono:      "JetBrains Mono", monospace;
      --radius:         8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }

    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
      gap: 1.5rem;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 0%, rgba(99,102,241,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 100%, rgba(99,102,241,0.05) 0%, transparent 70%);
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── header ── */
    .header { display: flex; flex-direction: column; gap: 0.3rem; }
    .header h1 { font-size: 1.3rem; font-weight: 600; font-family: var(--font-mono); }
    .header h1 span { color: var(--accent); }
    .header p { font-size: 0.85rem; color: var(--text-secondary); }

    /* ── card ── */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; }
    .card-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── collections ── */
    .collections-toggle {
      font-size: 0.72rem; font-family: var(--font-mono);
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 0.2rem 0.55rem; color: var(--text-muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .collections-toggle:hover { color: var(--text-secondary); border-color: rgba(255,255,255,0.15); }
    .collections-toggle.open { color: var(--accent); border-color: var(--accent-border); background: var(--accent-dim); }

    .collections-body { display: none; flex-direction: column; gap: 0.65rem; }
    .collections-body.open { display: flex; }

    .collections-search {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.4rem 0.7rem; font-family: var(--font-mono); font-size: 0.8rem;
      color: var(--text-primary); outline: none; transition: border-color 0.15s;
    }
    .collections-search::placeholder { color: var(--text-muted); }
    .collections-search:focus { border-color: var(--accent-border); }
    .collections-meta { font-size: 0.7rem; font-family: var(--font-mono); color: var(--text-muted); }

    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.35rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .collection-chip {
      display: flex; flex-direction: column; gap: 0.15rem;
      padding: 0.5rem 0.65rem; border-radius: 5px;
      border: 1px solid var(--border); background: var(--bg-elevated);
      cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .collection-chip:hover { border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.06); }
    .collection-chip.active { border-color: var(--accent-border); background: var(--accent-dim); }
    .chip-prefix { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }
    .collection-chip.active .chip-prefix { color: var(--text-primary); }
    .chip-name { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip-total { font-size: 0.65rem; font-family: var(--font-mono); color: var(--text-muted); }

    /* ── icon input ── */
    .input-label-row { display: flex; align-items: center; justify-content: space-between; }
    .input-label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); }
    .input-format { font-size: 0.72rem; font-family: var(--font-mono); color: var(--text-muted); }
    .input-format span { color: var(--accent); }

    .fetch-row { display: flex; gap: 0.5rem; }
    .fetch-input {
      flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.5rem 0.75rem; font-family: var(--font-mono); font-size: 0.85rem;
      color: var(--text-primary); outline: none; transition: border-color 0.15s;
    }
    .fetch-input::placeholder { color: var(--text-muted); }
    .fetch-input:focus { border-color: var(--accent-border); }

    .btn {
      background: var(--accent-dim); border: 1px solid rgba(99,102,241,0.35); border-radius: 6px;
      padding: 0.5rem 1rem; font-size: 0.825rem; font-family: var(--font-mono);
      color: var(--accent); cursor: pointer; transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(99,102,241,0.25); border-color: var(--accent-border); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .search-hint { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); display: none; }
    .search-hint.visible { display: block; }

    /* ── results ── */
    .results-wrap { display: none; flex-direction: column; gap: 0.6rem; }
    .results-wrap.visible { display: flex; }
    .results-header { display: flex; align-items: center; justify-content: space-between; }
    .results-count { font-size: 0.72rem; font-family: var(--font-mono); color: var(--text-muted); }
    .results-spinner { font-size: 0.72rem; font-family: var(--font-mono); color: var(--accent); display: none; }
    .results-spinner.visible { display: block; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 0.4rem; }

    .result-item {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 0.6rem 0.4rem; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-elevated);
      cursor: pointer; transition: border-color 0.12s, background 0.12s; min-width: 0;
    }
    .result-item:hover { border-color: rgba(99,102,241,0.3); background: rgba(99,102,241,0.06); }
    .result-item.selected { border-color: var(--accent-border); background: var(--accent-dim); }
    .result-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .result-icon img { width: 20px; height: 20px; }
    .result-name {
      font-size: 0.6rem; font-family: var(--font-mono); color: var(--text-muted);
      text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
    }
    .result-item.selected .result-name { color: var(--accent); }

    /* ── preview ── */
    .preview-row {
      display: flex; align-items: center; gap: 1.25rem;
      padding: 0.85rem 1rem; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: 6px; min-height: 56px;
    }
    .preview-icon { flex-shrink: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }
    .preview-icon svg { width: 24px; height: 24px; }
    .preview-name { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary); }
    .preview-empty { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

    /* ── divider ── */
    .divider { display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); font-size: 0.75rem; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* ── shared code area (textarea & pre) ── */
    .code-area {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      width: 100%;
      min-height: 110px;
      line-height: 1.65;
      tab-size: 2;
    }

    textarea.code-area {
      color: var(--text-secondary);
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
      display: block;
    }
    textarea.code-area::placeholder { color: var(--text-muted); }
    textarea.code-area:focus { border-color: rgba(99,102,241,0.4); }

    pre.code-area {
      overflow: auto;
      white-space: pre;
      word-break: normal;
      cursor: default;
      user-select: text;
      color: var(--text-secondary);
    }
    pre.code-area .placeholder {
      color: var(--text-muted);
      font-style: italic;
      font-family: var(--font-mono);
    }

    /* ── Prism token colors (SVG/XML) ── */
    .token.tag, .token.tag .token.tag { color: #60a5fa; }
    .token.attr-name { color: #34d399; }
    .token.attr-value { color: #fbbf24; }
    .token.attr-value .token.punctuation,
    .token.attr-value .token.attr-equals { color: #4b4f68; }
    .token.punctuation { color: #4b4f68; }
    .token.comment { color: #4b4f68; font-style: italic; }
    .token.doctype, .token.prolog, .token.cdata { color: #8b8fa8; }
    .token.namespace { opacity: 0.75; }

    /* ── status / copy / card header utils ── */
    .card-header-actions { display: flex; align-items: center; gap: 0.5rem; }

    .copy-btn {
      font-size: 0.75rem; font-family: var(--font-mono);
      background: none; border: 1px solid var(--border); border-radius: 5px;
      padding: 0.25rem 0.6rem; color: var(--text-muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.15); }
    .copy-btn.copied { color: var(--green); border-color: rgba(74,222,128,0.3); background: var(--green-dim); }

    .status { font-size: 0.775rem; font-family: var(--font-mono); padding: 0.3rem 0.6rem; border-radius: 4px; display: none; }
    .status.error { display: block; background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .status.ok    { display: block; background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }

    [hidden] { display: none !important; }

    /* ── responsive ── */
    @media (max-width: 520px) {
      body { padding: 1.25rem 0.9rem 3rem; }

      .card { padding: 1rem; }

      /* stack fetch input + button vertically */
      .fetch-row { flex-direction: column; }
      .fetch-row .btn { align-self: stretch; text-align: center; }

      /* convert button full-width */
      .btn[id="convertBtn"] { align-self: stretch; text-align: center; }

      /* smaller chips so 2 columns still fit on 320px */
      .collections-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }

      /* allow icon input label row to wrap */
      .input-label-row { flex-wrap: wrap; gap: 0.25rem; }

      /* tighter card header on small screens */
      .card-header-actions { gap: 0.35rem; }
      .input-format { display: none; }

      /* compact preview row */
      .preview-row { padding: 0.6rem 0.75rem; gap: 0.85rem; }

      /* slightly smaller icon grid cells */
      .results-grid { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); }

      .header h1 { font-size: 1.1rem; }
      .header p  { font-size: 0.8rem; }
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }</style>    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

</head>
  <body>
    <div class="wrap">
<div class="header">
  <h1>
svg <span>→</span> sommark
</h1>
  <p>Pick a collection, search icons, or paste raw SVG — get SomMark ready to copy.</p>
</div><div class="card">
  <div class="card-header">
    <span class="card-label">Collections</span>
    <button class="collections-toggle" id="collectionsToggle">show</button>
</div>
  <div class="collections-body" id="collectionsBody">
    <input class="collections-search" id="collectionsSearch" placeholder="Search collections..." autocomplete="off" spellcheck="false" />
    <span class="collections-meta" id="collectionsMeta">Loading...</span>
    <div class="collections-grid" id="collectionsGrid"></div>
</div>
</div><div class="card">
  <div class="input-label-row">
    <span class="input-label">icon</span>
    <div class="card-header-actions">
      <span class="input-format" id="inputFormat">
<span>collection</span>/name
</span>
      <button class="collections-toggle" id="allCollectionsToggle">search all</button>
</div>
</div>
  <div class="fetch-row">
    <input class="fetch-input" id="iconInput" type="text" placeholder="ph/github-logo  or  ph/lua  to search" spellcheck="false" autocomplete="off" />
    <button class="btn" id="fetchBtn">Fetch exact</button>
</div>
  <span class="search-hint" id="searchHint"></span>
  <div class="status" id="fetchStatus"></div>
  <div class="results-wrap" id="resultsWrap">
    <div class="results-header">
      <span class="results-count" id="resultsCount"></span>
      <span class="results-spinner" id="resultsSpinner">searching...</span>
</div>
    <div class="results-grid" id="resultsGrid"></div>
</div>
  <div class="preview-row">
    <div class="preview-icon" id="previewIcon"></div>
    <span class="preview-name" id="previewName">
      <span class="preview-empty">No icon loaded</span>
</span>
</div>
</div><div class="divider">or paste SVG</div>

<div class="card">
  <div class="card-header">
    <span class="card-label">SVG</span>
    <div class="card-header-actions">
      <span class="input-format" style="font-size:0.7rem;">raw &amp;lt;svg&amp;gt; markup</span>
      <button class="copy-btn" id="clearSvgBtn" style="display:none;">clear</button>
</div>
</div>
  <textarea class="code-area" id="svgInput" placeholder="&lt;svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 24 24\&quot;&gt; ... &lt;/svg&gt;" spellcheck="false"></textarea>
  <pre class="code-area" id="svgDisplay" hidden="true"></pre>
  <button class="btn" id="convertBtn" style="align-self:flex-start;">Convert</button>
</div><div class="card">
  <div class="card-header">
    <span class="card-label">SomMark</span>
    <button class="copy-btn" id="copyBtn">Copy</button>
</div>
  <pre class="code-area" id="output">
    <span class="placeholder">Output will appear here...</span>
</pre>
</div>    
</div>
